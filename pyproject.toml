[project]
name = "reap"
version = "0.1.0"
description = "reap: MoE Compression with expert pruning and merging."
readme = "README.md"
authors = [
    { name = "Mike Lasby", email = "mklasby@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.7.0",
    "datasets>=3.6.0, <4.0.0",
    "evalplus[vllm]>=0.3.1",
    "jupyter>=1.1.1",
    # lm-eval<0.4.10 references `AutoModelForVision2Seq`, removed in tx5.
    "lm-eval[vllm,api]>=0.4.10",
    "matplotlib>=3.10.3",
    "python-dotenv>=1.1.0",
    "seaborn>=0.13.2",
    # torch 2.11.0 is required by vllm 0.20.x (pinned exactly there).
    "torch==2.11.0",
    # "transformers==4.53.3",  # latest version working for ernie.
    # Qwen3.6 / Qwen3.5-MoE requires transformers>=5.2 (model added there), but
    # vllm>=0.20 excludes transformers 5.0.x through 5.5.0, so pin to >=5.6.
    "transformers>=5.6.0,<6.0.0",
    "umap-learn>=0.5.7",
    # vllm>=0.19 is required by Qwen3.6 model card; use >=0.20 to align with
    # the transformers>=5.6 constraint above.
    "vllm>=0.20.0",
    "livecodebench",
    "deepspeed>=0.17.4",
    "trl>=0.21.0",
    "hatchling>=1.27.0",
    # "flash-attn>=2.7.1,<=2.8.0", # required for xformers for Llama4. Might need to manually install with --no-build-isolation
    # "flash-attn>=2.8.3",
    "wandb>=0.21.1",
    "crfm-helm",
    "evalscope",
    # transformers>=5.6 requires tokenizers>=0.22,<=0.23.
    "tokenizers>=0.22.0,<=0.23.0",
    # lm-eval pulls in peft, but peft<0.19 imports HybridCache from
    # transformers, which was removed in v5. Force a tx5-compatible peft.
    "peft>=0.19.1",
]

[tool.uv.sources]
evalplus = { path = "third-party/evalplus", editable = true }
livecodebench = { path="third-party/LiveCodeBench", editable = true}
crfm-helm = { path="third-party/helm", editable = true }
evalscope = { path = "third-party/evalscope", editable=true}

[project.entry-points."vllm.general_plugins"]
llama_4_text_only = "reap.model_util:register_llama_with_vllm"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "kaleido>=1.0.0",
    "matplotlib>=3.10.3",
    "pandas>=2.3.0",
    "plotly>=6.1.2",
    "pytest>=8.4.1",
    "seaborn>=0.13.2",
    "umap-learn>=0.5.7",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
]

[tool.ruff]
line-length = 88
select = ["SIM"]

